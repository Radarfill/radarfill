name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt ruff
      - name: Lint (errors only)
        run: ruff check --select E9,F63,F7,F82 code/
      - name: Compile all Python
        run: python -m compileall -q code/
      - name: Block large or data files
        run: |
          if git ls-files | grep -E '\.(npy|parquet|zip)$|^dataset/'; then echo "Data files must not be committed"; exit 1; fi
          big=$(git ls-files -z | xargs -0 du -k | awk '$1 > 5000'); if [ -n "$big" ]; then echo "Files over 5 MB:"; echo "$big"; exit 1; fi
